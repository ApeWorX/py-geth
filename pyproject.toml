[build-system]
requires = ["setuptools>=75", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "py-geth"
dynamic = ["version"]
description = "py-geth: Run Go-Ethereum as a subprocess"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [
    { name = "The Ethereum Foundation", email = "snakecharmers@ethereum.org" },
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
maintainers = [
    { name = "ApeWorX Collective", email = "admin@apeworx.io" },
]
keywords = ["ethereum", "go-ethereum", "geth"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.6.0",
    "requests>=2.23",
    "semantic-version>=2.6.0",
    "typing-extensions>=4.0.1",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/py-geth"
Repository = "https://github.com/ApeWorX/py-geth.git"
Issues = "https://github.com/ApeWorX/py-geth/issues"
Funding = "https://github.com/sponsors/ApeWorX"

[dependency-groups]
test = [
    "flaky>=3.2.0",
    "pytest>=7.0.0",
    "pytest-xdist>=2.4.0",
]
lint = [
    "mypy==1.18.2",
    "ruff>=0.12.0",
    "types-requests>=2.0.0",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
docs = [
    "towncrier>=24,<25",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    "ipython",
    "prek",
]

[tool.setuptools.packages.find]
include = ["geth", "geth.*"]
exclude = ["scripts", "scripts.*", "tests", "tests.*"]

[tool.setuptools.package-data]
geth = [
    "default_blockchain_password",
    "genesis.json",
    "py.typed",
]

[tool.setuptools_scm]
fallback_version = "7.0.0b1"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-v --showlocals --durations 10"
log_date_format = "%m-%d %H:%M:%S"
log_format = "%(levelname)8s  %(asctime)s  %(filename)20s  %(message)s"
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".project-template"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-sort-within-sections = true
force-to-top = ["pytest"]
known-first-party = ["geth"]
known-third-party = ["hypothesis"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true

[tool.mdformat]
number = true
